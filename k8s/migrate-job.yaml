# Job migrate catalog — tunggu catalog-db ready dulu lewat initContainer
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-catalog
  namespace: suilens-2306275935
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-catalog-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h catalog-db -p 5432 -U catalog; do
                echo "Waiting for catalog-db...";
                sleep 3;
              done
      containers:
        - name: migrate-catalog
          image: alphasuthamedia/suilens-catalog-service:latest
          command: ["bunx", "drizzle-kit", "push"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: CATALOG_DATABASE_URL
