apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: suilens-2306275935
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      initContainers:
        - name: wait-catalog-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h catalog-db -p 5432 -U catalog; do echo "waiting..."; sleep 3; done
      containers:
        - name: catalog-service
          image: alphasuthamedia/suilens-catalog-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: CATALOG_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: suilens-2306275935
spec:
  type: NodePort
  selector:
    app: catalog-service
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: suilens-2306275935
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-order-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h order-db -p 5432 -U orders; do echo "waiting..."; sleep 3; done
        - name: wait-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting..."; sleep 3; done
      containers:
        - name: order-service
          image: alphasuthamedia/suilens-order-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: ORDER_DATABASE_URL
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: CATALOG_SERVICE_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: suilens-2306275935
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
---
