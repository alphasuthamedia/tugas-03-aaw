apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed
  namespace: suilens-2306275084
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-catalog-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z catalog-db 5432; do sleep 2; done
      containers:
        - name: catalog-seed
          image: wisnunugroho13/suilens-catalog-service:latest
          imagePullPolicy: Always
          command: ["bun", "run", "src/db/seed.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: CATALOG_DATABASE_URL
  backoffLimit: 3
