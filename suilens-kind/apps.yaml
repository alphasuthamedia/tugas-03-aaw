apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: suilens-2306275935
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: alphasuthamedia/suilens-catalog-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: CATALOG_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: suilens-2306275935
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - port: 3001
      targetPort: 3001

---
