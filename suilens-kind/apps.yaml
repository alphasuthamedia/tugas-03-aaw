apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: suilens-2306275935
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alphasuthamedia/suilens-frontend:latest
          ports:
            - containerPort: 5173
          env:
            - name: VITE_CATALOG_API
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: VITE_CATALOG_API
            - name: VITE_ORDER_API
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: VITE_ORDER_API
            - name: VITE_NOTIFICATION_WS
              valueFrom:
                configMapKeyRef:
                  name: suilens-config
                  key: VITE_NOTIFICATION_WS
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: suilens-2306275935
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5173
